services:
  backend:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////data/nastenka_flix.db
      MEDIA_ROOT: /media
      ALLOWED_ORIGINS: http://nastenka-flix,http://localhost,http://127.0.0.1
    volumes:
      - backend-data:/data
      - ./media:/media:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend-data:
